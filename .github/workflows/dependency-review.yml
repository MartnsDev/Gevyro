name: Dependency Review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  dependency-review:
    name: Bloquear dependencias vulneraveis
    runs-on: ubuntu-latest
    steps:
      - name: Revisar alteracoes de dependencias
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: false
