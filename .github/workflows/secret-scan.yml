name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Bloquear credenciais versionadas
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todo o historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar historico Git
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config /repo/.gitleaks.toml --redact=100 --no-banner /repo
