# URLs de produção
app.base-url=${APP_BASE_URL}
app.frontend.url=${APP_FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cookies HTTPS
app.cookie.secure=true
app.cookie.same-site=None

# Sessão temporária do OAuth2
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.http-only=true

# Google produção
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Banco
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# O MySQL do Railway opera em UTC por padrão. As métricas diárias usam
# CURDATE()/NOW(), portanto cada conexão deve trabalhar no fuso da operação.
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# Stripe
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.price.basico=${STRIPE_PRICE_BASICO}
stripe.price.pro=${STRIPE_PRICE_PRO}
stripe.price.premium=${STRIPE_PRICE_PREMIUM}

# Logs
logging.level.br.com.gestpro=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Erros
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.main.lazy-initialization=false
spring.devtools.restart.enabled=false
