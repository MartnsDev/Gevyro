# URLs locais
app.base-url=http://localhost:8080
app.frontend.url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# Cookies em HTTP local
app.cookie.secure=false
app.cookie.same-site=Lax

# Sessão temporária usada pelo OAuth2
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.http-only=true

# Google local
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Banco local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/gestpro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis local
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Stripe de teste
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.price.basico=${STRIPE_PRICE_BASICO}
stripe.price.pro=${STRIPE_PRICE_PRO}
stripe.price.premium=${STRIPE_PRICE_PREMIUM}

# Logs
logging.level.br.com.gestpro=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.hibernate.SQL=DEBUG

# Erros locais
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

spring.main.lazy-initialization=false
spring.devtools.restart.enabled=true