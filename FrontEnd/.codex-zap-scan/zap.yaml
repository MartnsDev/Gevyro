env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - https://api.gevyro.com.br/auth/csrf
    - https://api.gevyro.com.br/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: https://api.gevyro.com.br/
  type: spider
- parameters:
    maxDuration: 3
  type: passiveScan-wait
- parameters:
    format: Short
    summaryFile: /home/zap/zap_out.json
  rules: []
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: api.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
